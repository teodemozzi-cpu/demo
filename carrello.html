<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrello - SAXUM | Trento DOC</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --oro: #d4a574;
            --oro-dark: #b89462;
            --nero: #0d0d0d;
            --grigio-dark: #1a1a1a;
            --grigio-light: #2a2a2a;
            --bianco: #f5f5f5;
            --grigio-text: #d0d0d0;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body { 
            font-family: 'Montserrat', sans-serif;
            background-color: var(--nero); 
            color: var(--grigio-text);
            line-height: 1.8;
            min-height: 100vh;
        }

        header {
            padding: 1.5rem 6%;
            background: linear-gradient(135deg, rgba(29, 29, 29, 0.95) 0%, rgba(13, 13, 13, 0.95) 100%);
            border-bottom: 1px solid rgba(212, 165, 116, 0.2);
            text-align: center;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--oro);
            text-decoration: none;
            letter-spacing: 3px;
        }

        .logo:hover {
            text-shadow: 0 0 15px rgba(212, 165, 116, 0.4);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 4rem 6%;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--oro);
            text-align: center;
            margin-bottom: 3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--oro), transparent);
            margin: 1.5rem auto;
        }

        .carrello-list {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .carrello-item {
            background: linear-gradient(135deg, rgba(42, 42, 42, 0.6) 0%, rgba(26, 26, 26, 0.6) 100%);
            padding: 2rem;
            border-radius: 10px;
            border: 1px solid rgba(212, 165, 116, 0.15);
            backdrop-filter: blur(10px);
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 2rem;
            align-items: center;
            transition: all 0.4s ease;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .carrello-item:hover {
            background: linear-gradient(135deg, rgba(50, 50, 50, 0.8) 0%, rgba(35, 35, 35, 0.8) 100%);
            border-color: rgba(212, 165, 116, 0.3);
            transform: translateY(-2px);
        }

        .item-info h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: var(--bianco);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .item-info p {
            font-size: 0.9rem;
            color: #999;
        }

        .item-qty {
            text-align: center;
        }

        .item-qty label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .item-qty input {
            width: 50px;
            padding: 0.6rem;
            background: rgba(13, 13, 13, 0.8);
            border: 1px solid rgba(212, 165, 116, 0.3);
            color: var(--oro);
            text-align: center;
            border-radius: 4px;
            font-weight: 600;
        }

        .prezzo {
            text-align: center;
            min-width: 100px;
        }

        .prezzo-label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .prezzo-value {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            background: linear-gradient(135deg, var(--oro), var(--oro-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .btn-remove {
            background: linear-gradient(135deg, rgba(220, 53, 69, 0.8) 0%, rgba(200, 35, 51, 0.8) 100%);
            color: #fff;
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-remove:hover {
            background: linear-gradient(135deg, rgba(240, 73, 89, 1) 0%, rgba(220, 53, 69, 1) 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        .empty {
            text-align: center;
            padding: 3rem;
            color: #666;
            font-style: italic;
        }

        .empty i {
            font-size: 3rem;
            color: var(--oro);
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Riepilogo Totale */
        .summary {
            background: linear-gradient(135deg, rgba(42, 42, 42, 0.8) 0%, rgba(26, 26, 26, 0.8) 100%);
            padding: 3rem;
            border-radius: 10px;
            border: 1px solid rgba(212, 165, 116, 0.2);
            border-top: 2px solid var(--oro);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }

        .summary-row.totale {
            border-top: 1px solid rgba(212, 165, 116, 0.3);
            padding-top: 1.5rem;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .summary-label {
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .summary-value {
            background: linear-gradient(135deg, var(--oro), var(--oro-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-family: 'Cinzel', serif;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 1.2rem 2rem;
            border: none;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            border-radius: 6px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--oro) 0%, var(--oro-dark) 100%);
            color: #000;
            box-shadow: 0 6px 20px rgba(212, 165, 116, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 165, 116, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.2) 0%, rgba(180, 148, 98, 0.1) 100%);
            color: var(--oro);
            border: 2px solid var(--oro);
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.3) 0%, rgba(180, 148, 98, 0.2) 100%);
            box-shadow: 0 6px 20px rgba(212, 165, 116, 0.2);
            transform: translateY(-3px);
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid rgba(212, 165, 116, 0.15);
            color: #666;
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .container {
                padding: 3rem 5%;
            }

            .carrello-item {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .actions {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 1rem 4%;
            }

            h1 {
                font-size: 2rem;
            }

            .container {
                padding: 2rem 4%;
            }

            .carrello-item {
                padding: 1.5rem;
                gap: 1rem;
            }

            .item-info h3 {
                font-size: 1.2rem;
            }

            .prezzo-value {
                font-size: 1.3rem;
            }

            .btn {
                padding: 1rem 1.5rem;
                font-size: 0.75rem;
            }

            .summary {
                padding: 2rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
                letter-spacing: 1px;
            }

            .container {
                padding: 1.5rem 3%;
            }

            .carrello-item {
                padding: 1rem;
            }

            .item-qty input {
                width: 40px;
                padding: 0.5rem;
            }

            .btn-remove {
                padding: 0.6rem 1rem;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="saxum26.html" class="logo">SAXUM</a>
    </header>

    <div class="container">
        <h1>Il Tuo Carrello</h1>
        <div id="carrello" class="carrello-list"></div>
        
        <div id="summary" class="summary" style="display: none;">
            <div class="summary-row">
                <span class="summary-label">Subtotale:</span>
                <span class="summary-value" id="subtotale">€ 0.00</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Spedizione:</span>
                <span class="summary-value">Gratuita</span>
            </div>
            <div class="summary-row totale">
                <span class="summary-label">Totale:</span>
                <span class="summary-value" id="totale">€ 0.00</span>
            </div>
            <div class="actions">
                <a href="saxum26.html#prodotti" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Continua lo Shopping
                </a>
                <button class="btn btn-primary" onclick="procediAlPagamento()">
                    Procedi al Pagamento <i class="fas fa-arrow-right"></i>
                </button>
            </div>
            <div style="margin-top: 2rem; text-align: center;">
                <button class="btn btn-secondary" onclick="svuotaCarrello()" style="width: 100%;">
                    <i class="fas fa-trash"></i> Svuota Carrello
                </button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 SAXUM | Trento DOC di Montagna &mdash; Qualità senza compromessi</p>
    </footer>

    <script>
        function caricaCarrello() {
            let carrello = JSON.parse(localStorage.getItem('carrello')) || [];
            let container = document.getElementById('carrello');
            let summaryDiv = document.getElementById('summary');
            let totale = 0;

            if (carrello.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <i class="fas fa-shopping-cart"></i>
                        <p>Il carrello è vuoto.</p>
                        <p style="margin-top: 1rem; font-size: 0.9rem;">
                            <a href="saxum26.html#prodotti" style="color: var(--oro); text-decoration: underline;">Scopri i nostri spumanti</a>
                        </p>
                    </div>
                `;
                summaryDiv.style.display = 'none';
                return;
            }

            container.innerHTML = '';
            carrello.forEach((item, index) => {
                let subtotale = item.prezzo * item.quantita;
                totale += subtotale;
                
                container.innerHTML += `
                    <div class="carrello-item">
                        <div class="item-info">
                            <h3>${item.nome}</h3>
                            <p>€ ${item.prezzo.toFixed(2)} per bottiglia</p>
                        </div>
                        <div class="item-qty">
                            <label>Quantità</label>
                            <input type="number" min="1" value="${item.quantita}" onchange="aggiornaQuantita(${index}, this.value)">
                        </div>
                        <div class="prezzo">
                            <span class="prezzo-label">Subtotale</span>
                            <div class="prezzo-value">€ ${subtotale.toFixed(2)}</div>
                        </div>
                        <button class="btn-remove" onclick="rimuoviDalCarrello(${index})">
                            <i class="fas fa-trash-alt"></i> Rimuovi
                        </button>
                    </div>
                `;
            });

            document.getElementById('subtotale').textContent = '€ ' + totale.toFixed(2);
            document.getElementById('totale').textContent = '€ ' + totale.toFixed(2);
            summaryDiv.style.display = 'block';
        }

        function aggiornaQuantita(index, quantita) {
            let carrello = JSON.parse(localStorage.getItem('carrello')) || [];
            if (quantita > 0) {
                carrello[index].quantita = parseInt(quantita);
                localStorage.setItem('carrello', JSON.stringify(carrello));
                caricaCarrello();
            }
        }

        function rimuoviDalCarrello(index) {
            let carrello = JSON.parse(localStorage.getItem('carrello')) || [];
            carrello.splice(index, 1);
            localStorage.setItem('carrello', JSON.stringify(carrello));
            caricaCarrello();
        }

        function svuotaCarrello() {
            if (confirm('Vuoi svuotare il carrello?')) {
                localStorage.removeItem('carrello');
                caricaCarrello();
            }
        }

        function procediAlPagamento() {
            alert('Funzionalità di pagamento in sviluppo. Grazie per l\'interesse!');
        }

        window.onload = caricaCarrello;
    </script>

</body>
</html></content>
